name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  montawin:
    runs-on: windows-latest
    permissions:
      contents: write   # para publicar a Release quando entra no main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Testes
        run: dotnet test tests/Implantador.Tests
      - name: Compilar o Implantador (Native AOT)
        run: dotnet publish src/Implantador -c Release -r win-x64 -p:DebugType=none -o publicar
      - name: Compilar o Montador (exe único)
        run: >
          dotnet publish src/Montador -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publicar
      # Os dois exe vão juntos: o MontaWin.exe coloca o Implantador.exe no pendrive.
      - uses: actions/upload-artifact@v4
        with:
          name: MontaWin
          path: |
            publicar/MontaWin.exe
            publicar/Implantador.exe
      # Link fixo: https://github.com/<dono>/montawin/releases/latest (só para o que entra no main)
      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: MontaWin v1.${{ github.run_number }}
          body: Baixe MontaWin.exe e Implantador.exe e deixe os dois na mesma pasta.
          files: |
            publicar/MontaWin.exe
            publicar/Implantador.exe
