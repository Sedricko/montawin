name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  implantador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Testes
        run: dotnet test tests/Implantador.Tests
      - name: Compilar (Native AOT)
        run: dotnet publish src/Implantador -c Release -r win-x64 -o publicar
      - uses: actions/upload-artifact@v4
        with:
          name: Implantador
          path: publicar/Implantador.exe
